<script>
function resizeSnakeGame() {
  var game = document.querySelector('.EjCLSb');
  var dpad = document.getElementById('snake-dpad-controls');
  if (!game) return;
  var w = window.innerWidth;
  var h = window.innerHeight;
  if (!w || !h) return;

  var isMobileOrTablet = window.matchMedia('(max-width: 1024px), (pointer: coarse)').matches;
  var isFullscreen = document.body.classList.contains('is-fullscreen') ||
                     !!(document.fullscreenElement || document.webkitFullscreenElement);

  if (isMobileOrTablet && isFullscreen) {
    // Dynamic height calculation reserving space for D-Pad UNDER the game box
    var dpadH = h < 500 ? 130 : 176;
    var bottomMargin = 10;
    var availH = h - dpadH - bottomMargin;
    if (availH < 160) availH = 160;

    var scale = Math.min(w / 600, availH / 600);
    scale = Math.min(scale, 1.2);

    var scaledH = 600 * scale;
    var topOffset = Math.max(0, Math.floor((availH - scaledH) / 2));

    game.style.transformOrigin = 'top center';
    game.style.transform = 'scale(' + scale + ')';
    game.style.position = 'absolute';
    game.style.top = topOffset + 'px';
    game.style.left = Math.floor((w - 600) / 2) + 'px';

    if (dpad) {
      // Position the control buttons STRICTLY UNDER the game box
      var gameVisualBottom = topOffset + scaledH;
      var remainingSpace = h - gameVisualBottom;
      var dpadTop = gameVisualBottom + Math.max(6, Math.floor((remainingSpace - dpadH) / 2));

      dpad.style.position = 'fixed';
      dpad.style.top = dpadTop + 'px';
      dpad.style.bottom = 'auto';
      dpad.style.left = '50%';
      dpad.style.transform = 'translateX(-50%)';
    }
  } else {
    var scale = Math.min(w / 600, h / 600);
    game.style.transformOrigin = 'center center';
    game.style.transform = 'scale(' + scale + ')';
    game.style.position = 'relative';
    game.style.top = '0px';
    game.style.left = '0px';
    if (dpad) {
      dpad.style.top = 'auto';
    }
  }
}
window.addEventListener('resize', resizeSnakeGame);
window.addEventListener('orientationchange', function() { setTimeout(resizeSnakeGame, 100); });
document.addEventListener('DOMContentLoaded', resizeSnakeGame);
window.addEventListener('load', resizeSnakeGame);
setInterval(resizeSnakeGame, 500);
</script>

<script>
// Fullscreen handlers and state synchronization
function toggleSnakeFullscreen() {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: 'SNAKE_TOGGLE_FULLSCREEN' }, '*');
  } else {
    var isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
    if (!isFs) {
      var elem = document.documentElement;
      if (elem.requestFullscreen) elem.requestFullscreen();
      else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  }
}

function updateFullscreenState(forceFs) {
  var isFs = typeof forceFs === 'boolean' ? forceFs : !!(document.fullscreenElement || document.webkitFullscreenElement);
  if (isFs) {
    document.body.classList.add('is-fullscreen');
    var enterSvg = document.getElementById('fs-enter-svg');
    var exitSvg = document.getElementById('fs-exit-svg');
    if (enterSvg) enterSvg.style.display = 'none';
    if (exitSvg) exitSvg.style.display = 'block';
  } else {
    document.body.classList.remove('is-fullscreen');
    var enterSvg = document.getElementById('fs-enter-svg');
    var exitSvg = document.getElementById('fs-exit-svg');
    if (enterSvg) enterSvg.style.display = 'block';
    if (exitSvg) exitSvg.style.display = 'none';
  }
  if (typeof resizeSnakeGame === 'function') resizeSnakeGame();
}

document.addEventListener('fullscreenchange', function() { updateFullscreenState(); });
document.addEventListener('webkitfullscreenchange', function() { updateFullscreenState(); });

window.addEventListener('message', function(e) {
  if (e.data && e.data.type === 'SNAKE_SET_FULLSCREEN') {
    updateFullscreenState(e.data.isFullscreen);
  }
});

// Control game via Up, Down, Left, Right directional buttons
function sendDirection(dir) {
  var keyData = {
    up: { key: 'ArrowUp', code: 'ArrowUp', keyCode: 38 },
    down: { key: 'ArrowDown', code: 'ArrowDown', keyCode: 40 },
    left: { key: 'ArrowLeft', code: 'ArrowLeft', keyCode: 37 },
    right: { key: 'ArrowRight', code: 'ArrowRight', keyCode: 39 }
  }[dir];

  if (!keyData) return;

  try {
    if (navigator.vibrate) navigator.vibrate(20);
  } catch(err) {}

  // 1. Dispatch keyboard events
  function fireKeyEvent(eventType) {
    var ev;
    try {
      ev = new KeyboardEvent(eventType, {
        key: keyData.key,
        code: keyData.code,
        keyCode: keyData.keyCode,
        which: keyData.keyCode,
        bubbles: true,
        cancelable: true,
        view: window
      });
    } catch(e) {
      ev = document.createEvent('Event');
      ev.initEvent(eventType, true, true);
      ev.key = keyData.key;
      ev.code = keyData.code;
      ev.keyCode = keyData.keyCode;
      ev.which = keyData.keyCode;
    }
    try { Object.defineProperty(ev, 'keyCode', { get: function() { return keyData.keyCode; } }); } catch(e) {}
    try { Object.defineProperty(ev, 'which', { get: function() { return keyData.keyCode; } }); } catch(e) {}

    var canvas = document.querySelector('canvas.cer0Bd') || document.querySelector('canvas') || document.body;
    canvas.dispatchEvent(ev);
    document.dispatchEvent(ev);
    window.dispatchEvent(ev);
    document.documentElement.dispatchEvent(ev);
  }

  fireKeyEvent('keydown');
  setTimeout(function() { fireKeyEvent('keyup'); }, 30);

  // 2. Dispatch simulated swipe on the canvas in case mobile touch engine is active
  dispatchCanvasSwipe(dir);
}

function dispatchCanvasSwipe(dir) {
  var canvas = document.querySelector('canvas.cer0Bd') || document.querySelector('canvas');
  if (!canvas) return;
  var rect = canvas.getBoundingClientRect();
  if (!rect.width || !rect.height) return;

  var startX = rect.left + rect.width / 2;
  var startY = rect.top + rect.height / 2;
  var endX = startX;
  var endY = startY;
  var delta = Math.min(rect.width, rect.height) * 0.25 || 60;

  if (dir === 'up') endY -= delta;
  else if (dir === 'down') endY += delta;
  else if (dir === 'left') endX -= delta;
  else if (dir === 'right') endX += delta;

  var touchId = Math.floor(Math.random() * 100000);

  function makeTouch(x, y) {
    if (typeof Touch !== 'undefined') {
      try {
        return new Touch({
          identifier: touchId,
          target: canvas,
          clientX: x,
          clientY: y,
          pageX: x + window.scrollX,
          pageY: y + window.scrollY,
          screenX: x,
          screenY: y
        });
      } catch(e) {}
    }
    return {
      identifier: touchId,
      target: canvas,
      clientX: x,
      clientY: y,
      pageX: x,
      pageY: y,
      screenX: x,
      screenY: y
    };
  }

  try {
    var t0 = makeTouch(startX, startY);
    var evStart = new TouchEvent('touchstart', {
      bubbles: true,
      cancelable: true,
      touches: [t0],
      targetTouches: [t0],
      changedTouches: [t0]
    });
    canvas.dispatchEvent(evStart);

    var t1 = makeTouch(endX, endY);
    var evMove = new TouchEvent('touchmove', {
      bubbles: true,
      cancelable: true,
      touches: [t1],
      targetTouches: [t1],
      changedTouches: [t1]
    });
    canvas.dispatchEvent(evMove);

    var evEnd = new TouchEvent('touchend', {
      bubbles: true,
      cancelable: true,
      touches: [],
      targetTouches: [],
      changedTouches: [t1]
    });
    canvas.dispatchEvent(evEnd);
  } catch(e) {}
}

// Bind D-Pad buttons
function initDpadButtons() {
  var dpadBtns = document.querySelectorAll('.dpad-btn');
  dpadBtns.forEach(function(btn) {
    var dir = btn.getAttribute('data-dir');
    function trigger(e) {
      if (e) {
        if (e.cancelable) e.preventDefault();
        e.stopPropagation();
      }
      btn.classList.add('active');
      sendDirection(dir);
      setTimeout(function() { btn.classList.remove('active'); }, 120);
    }
    btn.addEventListener('touchstart', trigger, { passive: false });
    btn.addEventListener('pointerdown', trigger);
    btn.addEventListener('mousedown', trigger);
  });
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initDpadButtons);
} else {
  initDpadButtons();
}
</script>
