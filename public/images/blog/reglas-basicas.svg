<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <rect width="600" height="340" fill="#8ECC39" rx="14" />
  <rect x="30" y="30" width="540" height="280" fill="#FFFFFF" rx="12" />
  <!-- Grid cells representation -->
  <g opacity="0.1" stroke="#1C1C1C" stroke-width="1.5">
    <line x1="30" y1="90" x2="570" y2="90" />
    <line x1="30" y1="150" x2="570" y2="150" />
    <line x1="30" y1="210" x2="570" y2="210" />
    <line x1="30" y1="270" x2="570" y2="270" />
    <line x1="120" y1="30" x2="120" y2="310" />
    <line x1="210" y1="30" x2="210" y2="310" />
    <line x1="300" y1="30" x2="300" y2="310" />
    <line x1="390" y1="30" x2="390" y2="310" />
    <line x1="480" y1="30" x2="480" y2="310" />
  </g>
  <!-- Wall Boundary -->
  <rect x="50" y="50" width="500" height="240" fill="none" stroke="#E53E3E" stroke-width="4" stroke-dasharray="10 6" rx="8" />
  <text x="70" y="80" fill="#E53E3E" font-family="sans-serif" font-weight="700" font-size="16">LÍMITE DEL TABLERO</text>
  <!-- Snake and Rule indicators -->
  <path d="M 120 220 L 280 220 L 280 140 L 400 140" stroke="#4F78F8" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="450" cy="140" r="16" fill="#E53E3E" />
  <text x="360" y="250" fill="#1C1C1C" font-family="sans-serif" font-weight="600" font-size="18">+1 Punto y Crecimiento</text>
</svg>
